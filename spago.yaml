package:
  name: harmonia
  description: >
    Functional-harmony recipes and voice leading for PureScript: a scale-degree
    chord vocabulary (numeral, quality, tensions, slash, modal interchange) that
    realizes to pitch-class sets, plus composable voicings and minimum-motion
    voice leading. Pure Prelude/Data; builds on JS and purerl.
  publish:
    version: 0.2.0
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-harmonia
  dependencies:
    - arrays: ">=7.3.0 <8.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    dependencies:
      - effect
      - console
      - assert
      - quickcheck
      - arrays
      - foldable-traversable
      - maybe
      - tuples
      - order-theory
workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    # Test-only path dep (the Galois-adjunction law suite for the quantiser).
    # Before the next `spago publish` of harmonia, order-theory must itself be
    # published and this pinned to a registry version range.
    order-theory:
      path: ../../purescript-order-theory
